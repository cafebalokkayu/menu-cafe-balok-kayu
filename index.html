<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Menu Balok Kayu</title>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Merriweather', serif;
      margin: 0;
      padding: 0;
      background: #fefefe;
      color: #333;
    }

    .header {
      text-align: center;
      padding: 20px;
      background-color: #1e3d36;
      color: white;
    }

    .header img {
      max-width: 100px;
      margin-bottom: 10px;
    }

    .menu-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      padding: 20px;
      gap: 40px;
    }

    .menu-column {
      width: 100%;
      max-width: 400px;
    }

    .menu-section {
      margin-bottom: 30px;
    }

    .menu-section h3 {
      margin-bottom: 10px;
      color: #1e3d36;
      border-bottom: 2px solid #1e3d36;
      padding-bottom: 5px;
      font-size: 18px;
    }

    .menu-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 15px;
    }

    @media (min-width: 768px) {
      .menu-column {
        width: 45%;
      }
    }
  </style>
</head>
<body>

  <div class="header">
    <img src="Logo.jpg" alt="Logo Balok Kayu" />
    <h2>Balok Kayu</h2>
    <p>Jl. Raung No.17, Lirboyo, Kediri</p>
    <p>Buka setiap hari, 08.00 - 23.00</p>
  </div>

  <div class="menu-container">
    <div class="menu-column">
      <div class="menu-section">
        <h3>Black Coffee</h3>
        <div class="menu-item"><span>Espresso</span><span>15K</span></div>
        <div class="menu-item"><span>Americano</span><span>18K</span></div>
      </div>
      <div class="menu-section">
        <h3>Milk Coffee</h3>
        <div class="menu-item"><span>Latte</span><span>20K</span></div>
        <div class="menu-item"><span>Cappuccino</span><span>20K</span></div>
      </div>
    </div>
    <div class="menu-column">
      <div class="menu-section">
        <h3>Signature</h3>
        <div class="menu-item"><span>Avocado Latte</span><span>24K</span></div>
        <div class="menu-item"><span>Gula Aren Latte</span><span>23K</span></div>
      </div>
      <div class="menu-section">
        <h3>Non-Coffee</h3>
        <div class="menu-item"><span>Matcha Latte</span><span>22K</span></div>
        <div class="menu-item"><span>Chocolate</span><span>20K</span></div>
      </div>
    </div>
  </div>

</body>
</html>
