<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Menu Interaktif</title>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Merriweather', serif;
      margin: 0;
      padding: 0;
      background: #fefefe;
      color: #333;
    }

    .header {
      text-align: center;
      padding: 20px;
      background-color: #1e3d36;
      color: white;
    }

    .header img {
      max-width: 100px;
      margin-bottom: 10px;
    }

    .menu-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      padding: 20px;
      gap: 40px;
    }

    .menu-column {
      width: 100%;
      max-width: 400px;
    }

    .menu-section {
      margin-bottom: 30px;
    }

    .menu-section h3 {
      margin-bottom: 10px;
      color: #1e3d36;
      border-bottom: 2px solid #1e3d36;
      padding-bottom: 5px;
    }

    .menu-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .menu-item:hover {
      color: #1e3d36;
      font-weight: bold;
    }

    .menu-image {
      display: none;
      margin-top: 10px;
      border-radius: 8px;
      max-width: 100%;
    }

    @media (min-width: 768px) {
      .menu-column {
        width: 45%;
      }
    }
  </style>
</head>
<body>

  <div class="header">
    <img src="Logo.jpg" alt="Logo Balok Kayu" />
    <h2>Balok Kayu</h2>
    <p>Jl. Raung No.17, Lirboyo, Kediri</p>
    <p>Buka setiap hari, 08.00 - 23.00</p>
  </div>

  <div class="menu-container">
    <div class="menu-column">
      <div class="menu-section">
        <h3>Black Coffee</h3>

        <div class="menu-item" onclick="toggleImage('espresso-img')">
          <span>Espresso</span><span>15K</span>
        </div>
        <img id="espresso-img" class="menu-image" src="espresso.jpg" alt="Espresso" />

        <div class="menu-item" onclick="toggleImage('americano-img')">
          <span>Americano</span><span>18K</span>
        </div>
        <img id="americano-img" class="menu-image" src="americano.jpg" alt="Americano" />

      </div>
    </div>
  </div>

  <script>
    function toggleImage(id) {
      const img = document.getElementById(id);
      img.style.display = img.style.display === "block" ? "none" : "block";
    }
  </script>

</body>
</html>
