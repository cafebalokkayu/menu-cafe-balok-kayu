
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu | Cafe Balok Kayu</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fdfaf6;
      color: #333;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #6b4f3b;
      color: white;
      text-align: center;
      padding: 20px 10px;
    }
    .menu-section {
      padding: 20px;
      max-width: 800px;
      margin: auto;
    }
    .menu-category {
      margin-bottom: 30px;
    }
    .menu-item {
      cursor: pointer;
      padding: 12px;
      background: #fff;
      border: 1px solid #ddd;
      margin: 5px 0;
      border-radius: 8px;
      transition: background 0.2s ease;
    }
    .menu-item:hover {
      background: #f1eee9;
    }
    .modal {
      display: none;
      position: fixed;
      z-index: 999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.6);
      overflow: auto;
      padding: 20px;
      box-sizing: border-box;
    }
    .modal-content {
      background-color: white;
      margin: auto;
      padding: 20px;
      border-radius: 10px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      position: relative;
    }
    .modal img {
      max-width: 100%;
      border-radius: 10px;
      height: auto;
    }
    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 24px;
      cursor: pointer;
    }
    @media (max-width: 600px) {
      header h1 {
        font-size: 22px;
      }
      .menu-item {
        font-size: 16px;
        padding: 10px;
      }
      .modal-content {
        padding: 15px;
      }
      .close-btn {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <header>
  <img src="logo.jpg" alt="Logo Cafe Balok Kayu" style="height: 60px;">
  <h1>Menu Cafe Balok Kayu</h1>
  <p>Jl. Raung No.17, Lirboyo | Buka: 08.00–23.00</p>
</header>
  <div class="menu-section">
    <div class="menu-category">
      <h2>Signature Coffee</h2>
      <div class="menu-item" onclick="openModal('Latte', 'Latte dingin creamy dengan espresso dan susu segar.', 'https://via.placeholder.com/400x300?text=Latte')">
        Iced Latte - Rp22.000
      </div>
      <div class="menu-item" onclick="openModal('Avocado Latte', 'Alpukat segar diblend dengan susu & espresso.', 'https://via.placeholder.com/400x300?text=Avocado+Latte')">
        Avocado Latte - Rp26.000
      </div>
    </div>
    <div class="menu-category">
      <h2>Non-Coffee</h2>
      <div class="menu-item" onclick="openModal('Matcha Latte', 'Matcha Jepang premium dengan susu creamy.', 'https://via.placeholder.com/400x300?text=Matcha+Latte')">
        Matcha Latte - Rp24.000
      </div>
    </div>
  </div>

  <div id="modal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <h3 id="modal-title"></h3>
      <img id="modal-image" src="" alt="Menu Image" />
      <p id="modal-desc"></p>
    </div>
  </div>

  <script>
    function openModal(title, desc, image) {
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-desc').innerText = desc;
      document.getElementById('modal-image').src = image;
      document.getElementById('modal').style.display = 'block';
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }
  </script>
</body>
</html>
